server:
  port: 8080

spring:
  config:
    import: "file:c:/Users/pc/Desktop/CAPA/.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5432/capa
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: DmRj2003
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

# Camunda SaaS Configuration
camunda:
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID}
      client-secret: ${CAMUNDA_CLIENT_SECRET}
    cluster-id: ${CAMUNDA_CLUSTER_ID}
    region: ${CAMUNDA_CLUSTER_REGION}
    # Increased timeout settings
    timeout: 60000
    grpc:
      timeout: 60000
      keep-alive-time: 30000
    # Worker configuration
    worker:
      max-jobs-active: 3
      threads: 1
      poll-interval: 1000

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.company.capa: DEBUG
    io.camunda: DEBUG