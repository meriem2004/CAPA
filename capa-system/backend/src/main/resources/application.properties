# Camunda Configuration
camunda.client.mode=saas
camunda.client.auth.client-id=${CAMUNDA_CLIENT_ID}
camunda.client.auth.client-secret=${CAMUNDA_CLIENT_SECRET}
camunda.client.cluster-id=${CAMUNDA_CLUSTER_ID}
camunda.client.region=${CAMUNDA_CLUSTER_REGION}

# Zeebe (Camunda Cloud) client configuration
zeebe.client.cloud.cluster-id=${CAMUNDA_CLUSTER_ID}
zeebe.client.cloud.client-id=${CAMUNDA_CLIENT_ID}
zeebe.client.cloud.client-secret=${CAMUNDA_CLIENT_SECRET}
zeebe.client.cloud.region=${CAMUNDA_CLUSTER_REGION}

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:capadocuments}
minio.secure=${MINIO_SECURE:false}

# Application settings
spring.application.name=capa-minio-service
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# Logging
logging.level.io.camunda=DEBUG
logging.level.com.company.capa=DEBUG

# Existing JPA and SQL init settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always