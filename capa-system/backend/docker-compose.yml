version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: capa_postgres
    restart: always
    environment:
      POSTGRES_DB: capa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DmRj2003
    ports:
      - "5432:5432"
    volumes:
      - capa_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: capa_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - capa_minio_data:/data

volumes:
  capa_postgres_data:
  capa_minio_data:

