version: "3.8"

services:
  zeebe:
    image: camunda/zeebe:latest
    container_name: zeebe
    environment:
      - ZEEBE_BROKER_CLUSTER_PARTITIONS_COUNT=1
      - ZEEBE_BROKER_CLUSTER_REPLICATION_FACTOR=1
      - ZEEBE_BROKER_CLUSTER_CLUSTER_SIZE=1
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_INDEX_PREFIX=zeebe-record
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_DELAY=5
      # 👇 THIS LINE CHANGED
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1000
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_CLIENT_NODESET=elasticsearch:9200
    ports:
      - "26500:26500"      # gRPC for clients
    depends_on:
      - elasticsearch

  operate:
    image: camunda/operate:latest
    container_name: operate
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8081:8080"
    depends_on:
      - zeebe
      - elasticsearch

  tasklist:
    image: camunda/tasklist:latest
    container_name: tasklist
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8082:8080"
    depends_on:
      - zeebe
      - elasticsearch

  optimize:
    image: camunda/optimize:latest
    container_name: optimize
    environment:
      - OPTIMIZE_ELASTICSEARCH_HOST=elasticsearch
      - OPTIMIZE_ELASTICSEARCH_HTTP_PORT=9200
    ports:
      - "8090:8090"
    depends_on:
      - elasticsearch

  identity:
    image: camunda/identity:latest
    container_name: identity
    environment:
      - IDENTITY_AUTH_PROVIDER_BACKEND=keycloak
      - IDENTITY_AUTH_PROVIDER_ISSUER_URL=http://keycloak:8080/auth/realms/camunda-platform
      - IDENTITY_AUTH_PROVIDER_CLIENT_ID=identity
      - IDENTITY_AUTH_PROVIDER_CLIENT_SECRET=identity-secret
      - IDENTITY_DATABASE_HOST=identity-db
    ports:
      - "8084:8084"
    depends_on:
      - identity-db
      - keycloak

  identity-db:
    image: postgres:13
    container_name: identity-db
    environment:
      - POSTGRES_DB=identity
      - POSTGRES_USER=identity
      - POSTGRES_PASSWORD=identity

  keycloak:
    image: quay.io/keycloak/keycloak:legacy
    container_name: keycloak
    environment:
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin
    ports:
      - "18080:8080"
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
